name: CI Monorepo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Job 1: deteksi folder mana yang berubah
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # Job 2: hanya jalan jika ada perubahan di frontend
  frontend-job:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  # Job 3: hanya jalan jika ada perubahan di backend
  backend-job:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Job 4: KUNCI UNTUK BRANCH PROTECTION — selalu jalan, satu-satunya check yang diwajibkan
  pipeline-gate:
    needs: [changes, frontend-job, backend-job]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check final status
        if: |
          needs.changes.result != 'success' ||
          needs.frontend-job.result == 'failure' || needs.frontend-job.result == 'cancelled' ||
          needs.backend-job.result == 'failure' || needs.backend-job.result == 'cancelled'
        run: exit 1
